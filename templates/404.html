{% extends 'base.html' %}

{% block title %}Page Not Found | JobNest{% endblock %}

<div class="container">

    <div class="error-content">

        <div class="error-number">

        <a href="{% url 'home' %}"

    </div>

</div>

</section>

{% endblock %}
