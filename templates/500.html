{% extends 'base.html' %}

{% block title %}Server Error | JobNest{% endblock %}

{% block content %}

<section class="error-page">

<div class="container">

    <div class="error-content">

        <div class="error-number">
            500
        </div>

        <h1>Something Went Wrong</h1>

        <p>
            We couldn't process your request right now.
            Please try again.
        </p>

        <a href="{% url 'home' %}"
           class="btn-primary">

            <i class="fa-solid fa-house"></i>
            Back to Home

        </a>

    </div>

</div>

</section>

{% endblock %}
