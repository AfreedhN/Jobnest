{% extends 'base.html' %}

{% block title %}Login | JobNest{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <div class="auth-icon">
                    <i class="fa-solid fa-right-to-bracket"></i>
                </div>

                <h1>Welcome Back</h1>

                <p>
                    Login to continue your JobNest journey.
                </p>

            </div>


            <form method="POST">

                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">

                {% if error %}
                    <div class="form-error">
                        {{ error }}
                    </div>
                {% endif %}


                <div class="form-group">

                    <label>Username or Email</label>

                    <div class="input-icon">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            name="username"
                            required
                            placeholder="Enter username or email">

                    </div>

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <div class="input-icon input-icon--password">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            name="password"
                            id="loginPassword"
                            required
                            placeholder="Enter password">

                        <button type="button"
                                class="password-toggle toggle-password"
                                data-target="loginPassword"
                                aria-label="Show or hide password">
                            <i class="fa-regular fa-eye"></i>
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="checkbox-label">

                        <input
                            type="checkbox"
                            name="remember_me">

                        Remember me

                    </label>

                    <a href="{% url 'password_reset' %}">
                        Forgot password?
                    </a>

                </div>

                <div class="auth-submit-center" style="display: flex; justify-content: center;">
                    <button type="submit" class="btn-primary full-width">
                        Login
                    </button>
                </div>


            </form>


            <div class="auth-footer">

                <p>
                    Don't have an account?
                    <a href="{% url 'register' %}{% if next %}?next={{ next|urlencode }}{% endif %}">
                        Create account
                    </a>
                </p>

            </div>

        </div>

    </div>

</section>

{% endblock %}
