{% extends "base.html" %}

{% block title %}Password Updated | JobNest{% endblock %}

{% block content %}
<section class="auth-section">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon" style="background: #dcfce7; color: #166534;"><i class="fa-solid fa-check" aria-hidden="true"></i></div>
                <h1>Password updated successfully</h1>
                <p>Your password has been reset successfully. You can now log in with your new password.</p>
            </div>
            <div class="auth-submit-center" style="display: flex; justify-content: center;">
                <a class="btn-primary full-width" href="{% url 'login' %}">Go to Login</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
